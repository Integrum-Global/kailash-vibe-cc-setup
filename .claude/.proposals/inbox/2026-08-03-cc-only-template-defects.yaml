      argument is parsed. This is the exact class the template's own validate-emit.mjs
      (~line 155) documents and forbids for ALWAYS_INCLUDE tools, and which
      test-harness/tests/f1030d-fail-closed-bin.test.mjs A5 asserts against; the regression
      ships because test-harness/ is loom-only and the assertion never runs downstream.
      Consumer-visible effect: emit.mjs, validate-emit.mjs and validate-proximity-band.mjs
      are all unrunnable, so the mechanical audit battery is dead at every cc-only consumer —
      no headroom_pct, no rule-authoring.md Rule-10 proximity-band gate, and no
      allowlist-paths-coverage (#443) check. Suggested fix: convert to the lazy guarded
      `_require(...)`-in-try form already used elsewhere in the same file, with the
      documented fail-soft skip branch when the Codex overlay is absent.
