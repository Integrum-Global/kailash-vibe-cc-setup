  - file: .claude/bin/emit.mjs
    action: modified
    base_version: "3.31.0"
    diff_lines: "+1 -1"
    reason: >-
      Line 81 is a STATIC top-level `import { extractPolicies } from
      "../codex-mcp-guard/extract-policies.mjs";` but `.claude/codex-mcp-guard/` is not
      delivered to a `template_type: cc-only-legacy` / `clis: [claude]` consumer, so the
